<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Data Editor</title>
<style>
  :root { color-scheme: light dark; --fg: #151a2d; --muted: #5f6680; --bg: #f6f7fb; --accent: #4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaf2; --muted: #a0a6bd; --bg: #10131d; --accent: #8b85ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; text-align: center; }
  img { width: 96px; height: 96px; }
  h1 { margin: 12px 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  a { color: var(--accent); margin: 0 8px; }
</style>
</head>
<body>
<div>
  <img src="logo-300.png" alt="">
  <h1>Site Data Editor</h1>
  <p>View and edit cookies, local/session storage and request headers for any website.</p>
  <a href="privacy.html">Privacy policy</a>
  <a href="https://github.com/epicvishal/Extension">Source code</a>
</div>
</body>
</html>
